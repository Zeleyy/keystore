[package]
name = "keystore-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "keystore_core"
crate-type = ["rlib"]

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
hex = "0.4.3"
include_dir = "0.7.4"
keyring = { workspace = true }
r2d2 = "0.8.10"
rand = "0.10.1"
rusqlite = { version = "0.40.1", features = ["bundled-sqlcipher"] } # bundled-sqlcipher
rusqlite_migration = { version = "2.6.0", features = ["from-directory"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11.0"

[target.'cfg(target_os = "windows")'.dependencies]
openssl = { version = "0.10.76", features = ["vendored"] }
keyring = { workspace = true, features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["zbus-secret-service-keyring-store"] }
